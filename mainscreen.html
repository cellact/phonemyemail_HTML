<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PhoneMyEmail</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/fonts/system-fonts.css">
    <style>
        :root {
            --primary-white: #ffffff;
            --secondary-purple: rgb(115, 66, 160);
            --light-purple: #9370db;
            --dark-purple: #4b0082;
            --purple-10: rgba(115, 66, 160, 0.1);
            --purple-20: rgba(115, 66, 160, 0.2);
            --system-gray: #f2f2f7;
            --system-gray2: #e5e5ea;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --separator-color: rgba(60, 60, 67, 0.12);
            --background-color: #ffffff;
            --input-bg: #f2f2f7;
            --shadow-color: rgba(115, 66, 160, 0.3);
            --shadow-color-active: rgba(115, 66, 160, 0.2);
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-white: #1a1a1a;
                --secondary-purple: rgb(138, 93, 180);
                --light-purple: #a28bc7;
                --dark-purple: #5e3b88;
                --purple-10: rgba(138, 93, 180, 0.15);
                --purple-20: rgba(138, 93, 180, 0.25);
                --system-gray: #2c2c2e;
                --system-gray2: #3a3a3c;
                --text-primary: #ffffff;
                --text-secondary: #aeaeb2;
                --separator-color: rgba(200, 200, 205, 0.12);
                --background-color: rgb(23, 23, 23);
                --input-bg: #2c2c2e;
                --shadow-color: rgba(0, 0, 0, 0.5);
                --shadow-color-active: rgba(0, 0, 0, 0.7);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            font-family: -apple-system, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--background-color);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background-color: var(--background-color);
            position: relative;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            transition: transform 0.35s cubic-bezier(0.28, 0.11, 0.32, 1);
            overflow: hidden;
        }

        #chat-container {
            position: fixed;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            background-color: var(--background-color);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            transition: transform 0.35s cubic-bezier(0.28, 0.11, 0.32, 1);
            z-index: 10;
        }

        .slide-left {
            transform: translateX(-100%) translateZ(0) !important;
            -webkit-transform: translateX(-100%) translateZ(0) !important;
        }

        /* Clean header with just search bar */
        .header {
            padding: 8px 12px;
            background-color: var(--background-color);
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 0.5px solid var(--separator-color);
        }

        /* New header content container for layout */
        .header-content {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            max-width: 100%;
        }

        /* Larger, cleaner search bar */
        .input-container {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            padding-left: 16px;
            padding-right: 4px;
            border-radius: 20px;
            height: 40px;
            flex: 1;
            min-width: 0;
        }

        .input-container:focus-within {
            background-color: var(--purple-10);
            border: 1px solid var(--secondary-purple);
        }

        .input-icon {
            font-size: 22px !important;
            margin-right: 8px;
        }

        input[type="text"] {
            flex: 1;
            height: 40px;
            padding: 0;
            border: none;
            font-size: 16px;
            background: transparent;
            color: var(--text-primary);
            outline: none;
            min-width: 0;
            font-weight: 400;
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 4px;
            margin-left: 4px;
            height: 100%;
            align-items: center;
        }

        .action-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            background-color: var(--secondary-purple);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px var(--shadow-color);
            transition: all 0.2s ease;
            padding: 0;
        }

        .action-button:active {
            transform: scale(0.92);
            background-color: var(--dark-purple);
            box-shadow: 0 1px 3px var(--shadow-color-active);
        }

        .action-button i {
            font-size: 20px;
        }

        /* Add new contacts button styles */
        .contacts-button {
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background-color 0.2s ease;
            margin-left: 4px;
            min-width: 36px;
        }

        .contacts-button:active {
            background-color: var(--purple-10);
        }

        .contacts-button i {
            font-size: 22px;
            color: var(--secondary-purple);
        }

        .iframe-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }

        /* Voice Mail Full Screen */
        .voicemail-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--background-color);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .voicemail-screen.show {
            display: flex;
        }

        .voicemail-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .voicemail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 0.5px solid var(--separator-color);
        }

        .voicemail-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .voicemail-close {
            background: var(--input-bg);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            width: 40px;
            height: 40px;
        }

        .voicemail-close:active {
            transform: scale(0.92);
            background: var(--purple-10);
        }

        .voicemail-close i {
            font-size: 24px;
        }

        .voicemail-to {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-align: center;
            word-break: break-all;
        }

        .voicemail-to strong {
            color: var(--secondary-purple);
            font-weight: 600;
            display: block;
            font-size: 18px;
            margin-top: 4px;
        }

        .recording-visualizer {
            background: var(--input-bg);
            border-radius: 20px;
            padding: 40px 24px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }

        .recording-timer {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .recording-status {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recording-dot {
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .waveform-container {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .waveform-bar {
            width: 4px;
            background: var(--secondary-purple);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .voicemail-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .voicemail-controls-row {
            display: flex;
            gap: 12px;
        }

        .voicemail-button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .voicemail-button:active {
            transform: scale(0.96);
        }

        .voicemail-button.primary {
            background: var(--secondary-purple);
            color: white;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .voicemail-button.secondary {
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .voicemail-button.danger {
            background: #ff3b30;
            color: white;
        }

        .voicemail-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .voicemail-button i {
            font-size: 20px;
        }

        .audio-player {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: none;
        }

        .audio-player.show {
            display: block;
        }

        .audio-player audio {
            width: 100%;
        }

        .voicemail-prompt {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 20px;
            background: var(--background-color);
            border: 1px solid var(--separator-color);
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
            padding: 16px;
            z-index: 30;
            display: none;
        }

        .voicemail-prompt.show {
            display: block;
        }

        .voicemail-prompt-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .voicemail-prompt-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .voicemail-prompt-text {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-secondary);
        }

        .voicemail-prompt-close {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
        }

        .voicemail-prompt-close:active {
            background: var(--input-bg);
        }

        .voicemail-prompt-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .voicemail-prompt-button {
            border: none;
            border-radius: 14px;
            background: var(--secondary-purple);
            color: #fff;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .voicemail-prompt-button:active {
            transform: scale(0.98);
            background: var(--dark-purple);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="input-container">
                    <i class="material-icons input-icon">search</i>
                    <input type="text" placeholder="" id="numberInput">
                    <div class="action-buttons">
                        <button class="action-button message">
                            <i class="material-icons">chat</i>
                        </button>
                        <button class="action-button call">
                            <i class="material-icons">call</i>
                        </button>
                        <button class="action-button voicemail">
                            <i class="material-icons">voicemail</i>
                        </button>
                    </div>
                </div>
                <button class="contacts-button">
                    <i class="material-icons">contacts</i>
                </button>
            </div>
        </div>
        <div class="iframe-container">
            <iframe id="recentSessionsIframe" class="shimmer"></iframe>
        </div>
    </div>
    <div id="chat-container"></div>

    <div class="voicemail-prompt" id="voicemailPrompt">
        <div class="voicemail-prompt-header">
            <div>
                <div class="voicemail-prompt-title">Call failed, leave a voicemail?</div>
                <div class="voicemail-prompt-text" id="voicemailPromptText">
                    You can record a voice message and send it by email instead.
                </div>
            </div>
            <button class="voicemail-prompt-close" id="voicemailPromptClose" aria-label="Close">
                <i class="material-icons">close</i>
            </button>
        </div>
        <div class="voicemail-prompt-actions">
            <button class="voicemail-prompt-button" id="voicemailPromptRecord">
                <i class="material-icons">mic</i>
                <span>Record voicemail</span>
            </button>
        </div>
    </div>

    <!-- Voice Mail Full Screen -->
    <div class="voicemail-screen" id="voicemailScreen">
        <div class="voicemail-content">
            <div class="voicemail-header">
                <h2 class="voicemail-title">Voice Message</h2>
                <button class="voicemail-close" id="voicemailClose">
                    <i class="material-icons">close</i>
                </button>
            </div>
            
            <div class="voicemail-to">
                Sending to: <strong id="voicemailRecipient"></strong>
            </div>

            <div class="recording-visualizer">
                <div class="recording-timer" id="recordingTimer">00:00</div>
                <div class="recording-status" id="recordingStatus">
                    <span>Ready to record</span>
                </div>
                <div class="waveform-container" id="waveformContainer">
                    <!-- Waveform bars will be generated here -->
                </div>
            </div>

            <div class="audio-player" id="audioPlayer">
                <audio controls id="audioPlayback"></audio>
            </div>

            <div class="voicemail-controls">
                <div class="voicemail-controls-row">
                    <button class="voicemail-button secondary" id="recordButton">
                        <i class="material-icons">mic</i>
                        <span>Start Recording</span>
                    </button>
                    <button class="voicemail-button danger" id="stopButton" disabled>
                        <i class="material-icons">stop</i>
                        <span>Stop</span>
                    </button>
                </div>
                
                <button class="voicemail-button secondary" id="recordAgainButton" style="display: none;">
                    <i class="material-icons">refresh</i>
                    <span>Record Again</span>
                </button>

                <button class="voicemail-button primary" id="sendVoicemailButton" style="display: none;">
                    <i class="material-icons">email</i>
                    <span>Send Email</span>
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/lame.min.js"></script>
    <script>
        const controller = window.top.controller;
        const input = document.querySelector("#numberInput");
        const callButton = document.querySelector(".call");
        const messageButton = document.querySelector(".message");
        const domainButtons = document.querySelectorAll(".domain-button");
        const chatContainer = document.getElementById('chat-container');
        const contactsButton = document.querySelector(".contacts-button");
        const voicemailPrompt = document.getElementById('voicemailPrompt');
        const voicemailPromptClose = document.getElementById('voicemailPromptClose');
        const voicemailPromptRecord = document.getElementById('voicemailPromptRecord');
        const voicemailPromptText = document.getElementById('voicemailPromptText');

        const urlParams = new URLSearchParams(window.location.search);
        const remoteId = urlParams.get('remoteId');
        const sessionId = urlParams.get('sessionId');
        const localId = urlParams.get('localId');

        const channel = new BroadcastChannel('myChannel');
        let lastCallAttempt = '';
        let overlayType = null;

        const recentSessionsIframe = document.getElementById('recentSessionsIframe');
        if (localId) {
            recentSessionsIframe.src = `recentsessions.html?localId=${encodeURIComponent(localId)}`;
        } else {
            recentSessionsIframe.src = 'recentsessions.html';
        }

        if (remoteId && remoteId !== 'null') {
            console.log("opening chat" + remoteId);
            openChat(remoteId);
        } else if (sessionId && sessionId !== 'null') {
            console.log("opening chat" + sessionId);
            openChat(sessionId);
        }

        input.addEventListener('input', function(e) {
            this.value = this.value.toLowerCase();
        });

        callButton.addEventListener("click", function() {
            if (input.value === ""){
                return
            }
            makeCall(null, input.value);
        });

        messageButton.addEventListener("click", function() {
            if (input.value === ""){
                return
            }
            openChat(input.value);
        })

        domainButtons.forEach(button => {
            button.addEventListener("click", function() {
                input.value += this.textContent.toLowerCase();
            });
        });

        contactsButton.addEventListener("click", function() {
            controller.contactPicker(1);
        });

        window.addEventListener('message', (event) => {
            switch (event.data.action) {
                case 'call':
                    makeCall(
                        event.data.body.sessionId || null,
                        event.data.body.remoteId || event.data.body.sessionName || ''
                    );
                    break;
                    
                case 'chat':
                    openChat(event.data.body.sessionId);
                    break;

                case 'closeChat':
                    closeChat();
                    break;

                case 'fillInput':
                    fillInput(event.data.body.value);
                    break;

                case 'ringing':
                    break;
                case 'download-file':
                    downloadFile(event.data.body.messageId, event.data.body.fileId);
                    break;

                case 'hideAttempt':
                    break;
                case 'call-failed':
                    handleCallFailed(event.data.body && event.data.body.message);
                    break;
            }
        });
        
        window.addEventListener('popstate', function() {
            if (overlayType === 'chat') {
                closeChat(true);
            }
        });

        channel.addEventListener('message', (event) => {
            try {
                const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
                console.log("received data: "+event.data)
                if (data.injectRemoteId !== undefined) input.value = (data.injectRemoteId);
            } catch (error) {
                console.error("Error parsing message data:", error);
            }
        });

        function openChat(sessionId) {
            if (!overlayType) {
                history.pushState({page: 'chat'}, '', location.href);
            }
            overlayType = 'chat';

            const iframe = document.createElement('iframe');
            iframe.className = 'chat-iframe';
            iframe.style.cssText = 'width:100%;height:100%;border:none;visibility:hidden;';
            iframe.src = `chat.html?sessionId=${encodeURIComponent(sessionId)}&localId=${encodeURIComponent(localId || '')}`;
            
            chatContainer.innerHTML = '';
            chatContainer.appendChild(iframe);
            
            iframe.onload = () => {
                setTimeout(() => {
                    iframe.style.visibility = 'visible';
                    document.querySelector('.container').classList.add('slide-left');
                    chatContainer.classList.add('slide-left');
                }, 50);
            };
        }

        function closeChat(fromPopstate = false) {
            if (overlayType !== 'chat') {
                return;
            }

            overlayType = null;
            if (!fromPopstate) {
                history.back();
            }

            document.querySelector('.container').classList.remove('slide-left');
            chatContainer.classList.remove('slide-left');
            controller.getRecentSessions(20);
            
            // Update the URL in the parent window to reflect we're back to main screen
            if (window.parent && window.parent !== window) {
                console.log("updating url");
                const currentUrl = new URL(window.parent.location.href);
                currentUrl.searchParams.set('screen', 'MAIN');
                currentUrl.searchParams.set('remoteId', 'null');
                window.parent.history.replaceState({}, '', currentUrl.toString());
            }
            
            setTimeout(() => {
                chatContainer.innerHTML = '';
            }, 300);
        }
        function fillInput(value) {
            const input = document.getElementById("numberInput");
            if (input) {
                input.value = value;
            }
        }
        function resolveDialTarget(value) {
            // Keep dial target unchanged; native layer handles normalization/routing.
            return value;
        }

        function makeCall(sessionIdValue, rawTarget) {
            var dialTarget = resolveDialTarget(rawTarget || '');
            console.log("makeCall: input=" + rawTarget + " resolved=" + dialTarget);
            lastCallAttempt = rawTarget || '';
            closeVoicemailPrompt();

            if (sessionIdValue) {
                controller.callSession(sessionIdValue);
            } else {
                controller.callRemote(dialTarget);
            }
        }

        function closeVoicemailPrompt() {
            voicemailPrompt.classList.remove('show');
        }

        function canOfferVoicemail(target) {
            return typeof target === 'string' && target.indexOf('@') !== -1;
        }

        function openVoicemailScreen(recipient) {
            voicemailRecipient.textContent = recipient;
            voicemailScreen.classList.add('show');
            initWaveform();
            resetRecording();
        }

        function handleCallFailed(message) {
            if (!canOfferVoicemail(lastCallAttempt)) {
                return;
            }

            input.value = lastCallAttempt;
            voicemailPromptText.textContent = message
                ? message + ' Leave a voicemail instead?'
                : 'You can record a voice message and send it by email instead.';
            voicemailPrompt.classList.add('show');
        }
        function downloadFile(fileId, cid, messageId) {
            console.log("downloading file: "+fileId);
            controller.downloadFile(fileId, cid, messageId);
            // Implement file download functionality here
        }

        // ==================== VOICE MAIL FUNCTIONALITY ====================
        
        const voicemailButton = document.querySelector(".voicemail");
        const voicemailScreen = document.getElementById("voicemailScreen");
        const voicemailClose = document.getElementById("voicemailClose");
        const voicemailRecipient = document.getElementById("voicemailRecipient");
        const recordButton = document.getElementById("recordButton");
        const stopButton = document.getElementById("stopButton");
        const recordAgainButton = document.getElementById("recordAgainButton");
        const sendVoicemailButton = document.getElementById("sendVoicemailButton");
        const recordingTimer = document.getElementById("recordingTimer");
        const recordingStatus = document.getElementById("recordingStatus");
        const waveformContainer = document.getElementById("waveformContainer");
        const audioPlayer = document.getElementById("audioPlayer");
        const audioPlayback = document.getElementById("audioPlayback");

        let mediaRecorder;
        let audioChunks = [];
        let recordingStartTime;
        let timerInterval;
        let audioBlob;
        let waveformBars = [];
        let audioFile;
        let currentAudioUrl = null;
        let previewPreparationPromise = null;

        // Initialize waveform bars
        function initWaveform() {
            waveformContainer.innerHTML = '';
            waveformBars = [];
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.className = 'waveform-bar';
                bar.style.height = '4px';
                waveformContainer.appendChild(bar);
                waveformBars.push(bar);
            }
        }

        // Animate waveform during recording
        function animateWaveform() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                waveformBars.forEach(bar => {
                    const height = Math.random() * 50 + 10;
                    bar.style.height = height + 'px';
                });
                requestAnimationFrame(animateWaveform);
            }
        }

        // Reset waveform
        function resetWaveform() {
            waveformBars.forEach(bar => {
                bar.style.height = '4px';
            });
        }

        function clearAudioPreview() {
            if (currentAudioUrl) {
                URL.revokeObjectURL(currentAudioUrl);
                currentAudioUrl = null;
            }
            audioPlayback.pause();
            audioPlayback.removeAttribute('src');
            audioPlayback.load();
        }

        function showAudioPreview(blob) {
            clearAudioPreview();
            currentAudioUrl = URL.createObjectURL(blob);
            audioPlayback.src = currentAudioUrl;
            audioPlayback.load();
            audioPlayer.classList.add('show');
        }

        // Open voice mail screen
        voicemailButton.addEventListener("click", function() {
            if (input.value === "") {
                alert("Please enter an email address first");
                return;
            }
            openVoicemailScreen(input.value);
        });

        voicemailPromptClose.addEventListener("click", closeVoicemailPrompt);
        voicemailPromptRecord.addEventListener("click", function() {
            closeVoicemailPrompt();
            if (!lastCallAttempt) {
                return;
            }
            openVoicemailScreen(lastCallAttempt);
        });

        // Close voice mail screen
        voicemailClose.addEventListener("click", closeVoicemailScreen);

        function closeVoicemailScreen() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
            }
            voicemailScreen.classList.remove('show');
        }

        // Reset recording state
        function resetRecording() {
            audioChunks = [];
            audioBlob = null;
            audioFile = null;
            previewPreparationPromise = null;
            recordingTimer.textContent = '00:00';
            recordingStatus.innerHTML = '<span>Ready to record</span>';
            recordButton.style.display = 'block';
            recordButton.disabled = false;
            stopButton.disabled = true;
            recordAgainButton.style.display = 'none';
            sendVoicemailButton.style.display = 'none';
            audioPlayer.classList.remove('show');
            clearAudioPreview();
            resetWaveform();
        }

        // Record again button
        recordAgainButton.addEventListener("click", function() {
            resetRecording();
        });

        // Start recording
        recordButton.addEventListener("click", async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const recordingMimeType = mediaRecorder.mimeType || (audioChunks[0] && audioChunks[0].type) || 'audio/webm';
                    audioBlob = new Blob(audioChunks, { type: recordingMimeType });
                    audioFile = null;
                    previewPreparationPromise = null;
                    recordAgainButton.style.display = 'block';
                    sendVoicemailButton.style.display = 'block';

                    try {
                        recordingStatus.innerHTML = '<span>Preparing MP3 preview...</span>';
                        const preparedAudioFile = await ensureMp3File();
                        showAudioPreview(preparedAudioFile);
                        recordingStatus.innerHTML = '<span>Recording complete - MP3 preview ready</span>';
                    } catch (previewError) {
                        console.error('MP3 preview preparation failed:', previewError);
                        showAudioPreview(audioBlob);
                        recordingStatus.innerHTML = '<span>Recording complete - Preview below</span>';
                    } finally {
                        // Stop all tracks
                        stream.getTracks().forEach(track => track.stop());
                    }
                };

                mediaRecorder.start();
                recordingStartTime = Date.now();
                
                // Update UI
                recordButton.style.display = 'none';
                stopButton.disabled = false;
                recordingStatus.innerHTML = '<div class="recording-dot"></div><span>Recording...</span>';
                
                // Start timer
                timerInterval = setInterval(updateTimer, 100);
                
                // Animate waveform
                animateWaveform();
                
            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Could not access microphone. Please check permissions.');
            }
        });

        // Stop recording
        stopButton.addEventListener("click", stopRecording);

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                clearInterval(timerInterval);
                stopButton.disabled = true;
                recordingStatus.innerHTML = '<span>Recording complete - Preview below</span>';
                resetWaveform();
            }
        }

        // Update timer
        function updateTimer() {
            const elapsed = Date.now() - recordingStartTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            
            const formattedTime = 
                String(minutes).padStart(2, '0') + ':' + 
                String(remainingSeconds).padStart(2, '0');
            
            recordingTimer.textContent = formattedTime;
        }

        function blobToBase64(blob) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onloadend = function() {
                    var result = reader.result || '';
                    var base64 = String(result).split(',')[1] || '';
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function getAudioContextClass() {
            return window.AudioContext || window.webkitAudioContext || null;
        }

        function floatTo16BitPCM(float32Array) {
            var pcm = new Int16Array(float32Array.length);
            for (var i = 0; i < float32Array.length; i++) {
                var sample = Math.max(-1, Math.min(1, float32Array[i]));
                pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }
            return pcm;
        }

        function decodeAudioDataCompat(audioContext, arrayBuffer) {
            return new Promise(function(resolve, reject) {
                audioContext.decodeAudioData(arrayBuffer, resolve, reject);
            });
        }

        async function transcodeRecordingToMp3(sourceBlob) {
            if (!window.lamejs || !window.lamejs.Mp3Encoder) {
                throw new Error('MP3 encoder failed to load');
            }

            var AudioContextClass = getAudioContextClass();
            if (!AudioContextClass) {
                throw new Error('Audio decoding is not supported on this device');
            }

            var audioContext = new AudioContextClass();

            try {
                var sourceBuffer = await sourceBlob.arrayBuffer();
                var audioBuffer = await decodeAudioDataCompat(audioContext, sourceBuffer.slice(0));
                var channelCount = Math.min(audioBuffer.numberOfChannels || 1, 2);
                var leftChannel = audioBuffer.getChannelData(0);
                var sampleRate = audioBuffer.sampleRate || 44100;
                var encoder = new window.lamejs.Mp3Encoder(channelCount, sampleRate, 128);
                var blockSize = 1152;
                var mp3Chunks = [];

                if (channelCount === 1) {
                    var monoPcm = floatTo16BitPCM(leftChannel);
                    for (var monoOffset = 0; monoOffset < monoPcm.length; monoOffset += blockSize) {
                        var monoChunk = monoPcm.subarray(monoOffset, monoOffset + blockSize);
                        var monoEncoded = encoder.encodeBuffer(monoChunk);
                        if (monoEncoded.length > 0) {
                            mp3Chunks.push(new Int8Array(monoEncoded));
                        }
                    }
                } else {
                    var rightChannel = audioBuffer.getChannelData(1);
                    var leftPcm = floatTo16BitPCM(leftChannel);
                    var rightPcm = floatTo16BitPCM(rightChannel);

                    for (var stereoOffset = 0; stereoOffset < leftPcm.length; stereoOffset += blockSize) {
                        var leftChunk = leftPcm.subarray(stereoOffset, stereoOffset + blockSize);
                        var rightChunk = rightPcm.subarray(stereoOffset, stereoOffset + blockSize);
                        var stereoEncoded = encoder.encodeBuffer(leftChunk, rightChunk);
                        if (stereoEncoded.length > 0) {
                            mp3Chunks.push(new Int8Array(stereoEncoded));
                        }
                    }
                }

                var flushData = encoder.flush();
                if (flushData.length > 0) {
                    mp3Chunks.push(new Int8Array(flushData));
                }

                if (!mp3Chunks.length) {
                    throw new Error('MP3 conversion produced no audio data');
                }

                return new Blob(mp3Chunks, { type: 'audio/mpeg' });
            } finally {
                if (audioContext && typeof audioContext.close === 'function') {
                    try {
                        await audioContext.close();
                    } catch (closeError) {
                        console.log('AudioContext close failed:', closeError);
                    }
                }
            }
        }

        async function ensureMp3File() {
            if (audioFile) {
                return audioFile;
            }

            if (!audioBlob) {
                throw new Error('No recording available');
            }

            if (!previewPreparationPromise) {
                previewPreparationPromise = (async function() {
                    var mp3Blob = await transcodeRecordingToMp3(audioBlob);
                    audioFile = new File(
                        [mp3Blob],
                        'voicemail.mp3',
                        { type: 'audio/mpeg' }
                    );
                    return audioFile;
                })();
            }

            return previewPreparationPromise;
        }

        // Send voicemail through native bridge first, then fall back to share/download
        sendVoicemailButton.addEventListener("click", async function() {
            if (!audioBlob) {
                alert('No recording available');
                return;
            }

            // Get recipient email from the input field
            var input = document.querySelector("#numberInput");
            var recipientEmail = input ? input.value : '';
            if (!recipientEmail) {
                alert('Please enter a recipient email address first');
                return;
            }

            var subject = 'Voice message from PhoneMyEmail';
            var emailBody = 
                'Send to: ' + recipientEmail + '\n\n' +
                'Hi ' + recipientEmail + ',\n\n' +
                'I tried to contact you with PhoneMyEmail, but you don\'t have a user yet.\n\n' +
                'I\'ve recorded a voice message for you - it\'s attached.\n\n' +
                'If you want to phone me back, feel free to phone my email!\n\n' +
                'Best regards';
            var previousStatus = recordingStatus.innerHTML;
            sendVoicemailButton.disabled = true;
            recordAgainButton.disabled = true;

            var preparedAudioFile;
            try {
                recordingStatus.innerHTML = '<span>Preparing MP3...</span>';
                await new Promise(function(resolve) { setTimeout(resolve, 0); });
                preparedAudioFile = await ensureMp3File();
                recordingStatus.innerHTML = '<span>MP3 ready - opening email...</span>';
            } catch (conversionError) {
                console.error('MP3 conversion failed:', conversionError);
                recordingStatus.innerHTML = previousStatus;
                sendVoicemailButton.disabled = false;
                recordAgainButton.disabled = false;
                alert('Could not convert the recording to MP3 on this device.');
                return;
            }

            // Preferred path: let native client open the email composer
            try {
                var fileDataBase64 = await blobToBase64(preparedAudioFile);
                controller.sendMessageToNativeApp({
                    action: "send-email-with-attachment",
                    body: {
                        to: recipientEmail,
                        subject: subject,
                        content: emailBody,
                        fileName: preparedAudioFile.name,
                        mimeType: preparedAudioFile.type || 'audio/mpeg',
                        fileDataBase64: fileDataBase64
                    }
                });
                closeVoicemailScreen();
                return;
            } catch (err) {
                console.log('Native email bridge failed, falling back:', err);
            }

            // Use Web Share API - auto-attaches the audio file
            if (navigator.canShare && navigator.canShare({ files: [preparedAudioFile] })) {
                try {
                    await navigator.share({
                        title: subject,
                        text: emailBody,
                        files: [preparedAudioFile]
                    });
                    closeVoicemailScreen();
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') {
                        recordingStatus.innerHTML = previousStatus;
                        sendVoicemailButton.disabled = false;
                        recordAgainButton.disabled = false;
                        return;
                    }
                    console.log('Share with file failed:', err);
                }
            }

            // Fallback: share without file
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: subject,
                        text: emailBody
                    });
                    closeVoicemailScreen();
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') {
                        recordingStatus.innerHTML = previousStatus;
                        sendVoicemailButton.disabled = false;
                        recordAgainButton.disabled = false;
                        return;
                    }
                    console.log('Share failed:', err);
                }
            }

            // Last resort: download + alert
            try {
                var url = URL.createObjectURL(preparedAudioFile);
                var a = document.createElement('a');
                a.href = url;
                a.download = preparedAudioFile.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('Voice message downloaded! Please email it manually.');
                closeVoicemailScreen();
            } catch (e) {
                console.error('Fallback failed:', e);
                recordingStatus.innerHTML = previousStatus;
                sendVoicemailButton.disabled = false;
                recordAgainButton.disabled = false;
                alert('Could not share. Please try again.');
            }
        });
    </script>
</body>
</html>
