<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Purple Connect</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/fonts/system-fonts.css">
    <style>
        :root {
            --primary-white: #ffffff;
            --secondary-purple: rgb(115, 66, 160);
            --light-purple: #8e8aff;
            --dark-purple: #3634a3;
            --purple-10: rgba(115, 66, 160, 0.1);
            --purple-20: rgba(115, 66, 160, 0.2);
            --system-gray: #f2f2f7;
            --system-gray2: #e5e5ea;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --separator-color: rgba(60, 60, 67, 0.12);
            --background-color: #ffffff;
            --input-bg: #f2f2f7;
            --shadow-color: rgba(115, 66, 160, 0.3);
            --shadow-color-active: rgba(115, 66, 160, 0.2);
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-white: #1a1a1a;
                --secondary-purple: rgb(138, 93, 180);
                --light-purple: #a28bc7;
                --dark-purple: #5e3b88;
                --purple-10: rgba(138, 93, 180, 0.15);
                --purple-20: rgba(138, 93, 180, 0.25);
                --system-gray: #2c2c2e;
                --system-gray2: #3a3a3c;
                --text-primary: #ffffff;
                --text-secondary: #aeaeb2;
                --separator-color: rgba(200, 200, 205, 0.12);
                --background-color: rgb(23, 23, 23);
                --input-bg: #2c2c2e;
                --shadow-color: rgba(0, 0, 0, 0.5);
                --shadow-color-active: rgba(0, 0, 0, 0.7);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            font-family: -apple-system, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--background-color);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background-color: var(--background-color);
            position: relative;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            transition: transform 0.35s cubic-bezier(0.28, 0.11, 0.32, 1);
            overflow: hidden;
        }

        #chat-container {
            position: fixed;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            background-color: var(--background-color);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            transition: transform 0.35s cubic-bezier(0.28, 0.11, 0.32, 1);
            z-index: 10;
        }

        .slide-left {
            transform: translateX(-100%) translateZ(0) !important;
            -webkit-transform: translateX(-100%) translateZ(0) !important;
        }

        /* Clean header with just search bar */
        .header {
            padding: 8px 12px;
            background-color: var(--background-color);
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 0.5px solid var(--separator-color);
        }

        /* New header content container for layout */
        .header-content {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            max-width: 100%;
        }

        /* Larger, cleaner search bar */
        .input-container {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            padding-left: 16px;
            padding-right: 4px;
            border-radius: 20px;
            height: 40px;
            flex: 1;
            min-width: 0;
        }

        .input-container:focus-within {
            background-color: var(--purple-10);
            border: 1px solid var(--secondary-purple);
        }

        .input-icon {
            font-size: 22px !important;
            margin-right: 8px;
        }

        input[type="text"] {
            flex: 1;
            height: 40px;
            padding: 0;
            border: none;
            font-size: 16px;
            background: transparent;
            color: var(--text-primary);
            outline: none;
            min-width: 0;
            font-weight: 400;
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 4px;
            margin-left: 4px;
            height: 100%;
            align-items: center;
        }

        .action-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            background-color: var(--secondary-purple);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px var(--shadow-color);
            transition: all 0.2s ease;
            padding: 0;
        }

        .action-button:active {
            transform: scale(0.92);
            background-color: var(--dark-purple);
            box-shadow: 0 1px 3px var(--shadow-color-active);
        }

        .action-button i {
            font-size: 20px;
        }

        /* Add new contacts button styles */
        .contacts-button {
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background-color 0.2s ease;
            margin-left: 4px;
            min-width: 36px;
        }

        .contacts-button:active {
            background-color: var(--purple-10);
        }

        .contacts-button i {
            font-size: 22px;
            color: var(--secondary-purple);
        }

        .iframe-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }

        /* Add these styles */
        .calling-overlay {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            background: linear-gradient(135deg, 
                rgba(115, 66, 160, 0.5) 0%,
                rgba(54, 52, 163, 0.5) 100%
            );
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            transform: translateY(-150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .calling-overlay.show {
            transform: translateY(0);
        }

        .calling-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
            margin-right: 12px;
        }

        .calling-spinner {
            width: 24px;
            height: 24px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top: 2.5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .calling-text {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        #callingId {
            font-weight: 600;
            margin-left: 4px;
            display: inline-block;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: bottom;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .cancel-call {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .cancel-call:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.96);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Voice Mail Modal */
        .voicemail-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .voicemail-modal.show {
            display: flex;
        }

        .voicemail-content {
            background: var(--background-color);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .voicemail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .voicemail-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .voicemail-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voicemail-close i {
            font-size: 24px;
        }

        .voicemail-to {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            word-break: break-all;
        }

        .voicemail-to strong {
            color: var(--secondary-purple);
            font-weight: 600;
        }

        .recording-visualizer {
            background: var(--input-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .recording-timer {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .recording-status {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recording-dot {
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .waveform-container {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .waveform-bar {
            width: 4px;
            background: var(--secondary-purple);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .voicemail-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .voicemail-button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .voicemail-button:active {
            transform: scale(0.96);
        }

        .voicemail-button.primary {
            background: var(--secondary-purple);
            color: white;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .voicemail-button.secondary {
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .voicemail-button.danger {
            background: #ff3b30;
            color: white;
        }

        .voicemail-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .voicemail-button i {
            font-size: 20px;
        }

        .audio-player {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: none;
        }

        .audio-player.show {
            display: block;
        }

        .audio-player audio {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="input-container">
                    <i class="material-icons input-icon">search</i>
                    <input type="text" placeholder="" id="numberInput">
                    <div class="action-buttons">
                        <button class="action-button message">
                            <i class="material-icons">chat</i>
                        </button>
                        <button class="action-button voicemail">
                            <i class="material-icons">voicemail</i>
                        </button>
                        <button class="action-button call">
                            <i class="material-icons">call</i>
                        </button>
                    </div>
                </div>
                <button class="contacts-button">
                    <i class="material-icons">contacts</i>
                </button>
            </div>
        </div>
        <div class="iframe-container">
            <iframe src="recentsessions.html" class="shimmer"></iframe>
        </div>
    </div>
    <div id="chat-container"></div>
    <div class="calling-overlay" id="callingOverlay">
        <div class="calling-left">
            <div class="calling-spinner"></div>
            <span class="calling-text">Calling <span id="callingId"></span></span>
        </div>
        <button class="cancel-call" id="cancelCall">Cancel</button>
    </div>

    <!-- Voice Mail Modal -->
    <div class="voicemail-modal" id="voicemailModal">
        <div class="voicemail-content">
            <div class="voicemail-header">
                <h2 class="voicemail-title">Voice Message</h2>
                <button class="voicemail-close" id="voicemailClose">
                    <i class="material-icons">close</i>
                </button>
            </div>
            
            <div class="voicemail-to">
                Sending to: <strong id="voicemailRecipient"></strong>
            </div>

            <div class="recording-visualizer">
                <div class="recording-timer" id="recordingTimer">00:00</div>
                <div class="recording-status" id="recordingStatus">
                    <span>Ready to record</span>
                </div>
                <div class="waveform-container" id="waveformContainer">
                    <!-- Waveform bars will be generated here -->
                </div>
            </div>

            <div class="audio-player" id="audioPlayer">
                <audio controls id="audioPlayback"></audio>
            </div>

            <div class="voicemail-controls">
                <button class="voicemail-button secondary" id="recordButton">
                    <i class="material-icons">mic</i>
                    <span>Start</span>
                </button>
                <button class="voicemail-button danger" id="stopButton" disabled>
                    <i class="material-icons">stop</i>
                    <span>Stop</span>
                </button>
            </div>

            <button class="voicemail-button primary" id="sendVoicemailButton" style="display: none;">
                <i class="material-icons">email</i>
                <span>Send Email</span>
            </button>
        </div>
    </div>

    <script>
        const controller = window.top.controller;
        const input = document.querySelector("#numberInput");
        const callButton = document.querySelector(".call");
        const messageButton = document.querySelector(".message");
        const domainButtons = document.querySelectorAll(".domain-button");
        const chatContainer = document.getElementById('chat-container');
        const contactsButton = document.querySelector(".contacts-button");
        const overlay = document.getElementById('callingOverlay');

        const urlParams = new URLSearchParams(window.location.search);
        const remoteId = urlParams.get('remoteId');

        const channel = new BroadcastChannel('myChannel');

        if(remoteId != null) {
            console.log("opening chat" + remoteId);
            openChat(remoteId);
        }

        input.addEventListener('input', function(e) {
            this.value = this.value.toLowerCase();
        });

        callButton.addEventListener("click", function() {
            if (input.value === ""){
                return
            }
            makeCall(input.value);
        });

        messageButton.addEventListener("click", function() {
            if (input.value === ""){
                return
            }
            openChat(input.value);
        })

        domainButtons.forEach(button => {
            button.addEventListener("click", function() {
                input.value += this.textContent.toLowerCase();
            });
        });

        contactsButton.addEventListener("click", function() {
            controller.contactPicker(1);
        });

        window.addEventListener('message', (event) => {
            switch (event.data.action) {
                case 'call':
                    makeCall(event.data.body.remoteId, event.data.body.contact);
                    break;
                    
                case 'chat':
                    openChat(event.data.body.sessionId);
                    break;

                case 'closeChat':
                    closeChat();
                    break;

                case 'fillInput':
                    fillInput(event.data.body.value);
                    break;

                case 'ringing':
                    // Close the calling overlay if it's open
                    overlay.classList.remove('show');
                    break;
                case 'download-file':
                    downloadFile(event.data.body.messageId, event.data.body.fileId);
                    break;

                case 'hideAttempt':
                    overlay.classList.remove('show');
                    break;
            }
        });
        
        window.addEventListener('popstate', function(event) {
            console.log("back button pressed");
            closeChat();
        });

        channel.addEventListener('message', (event) => {
            try {
                const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
                console.log("received data: "+event.data)
                if (data.injectRemoteId !== undefined) input.value = (data.injectRemoteId);
            } catch (error) {
                console.error("Error parsing message data:", error);
            }
        });

        function openChat(sessionId) {
            const iframe = document.createElement('iframe');
            iframe.className = 'chat-iframe';
            iframe.style.cssText = 'width:100%;height:100%;border:none;visibility:hidden;';
            iframe.src = `chat.html?sessionId=${encodeURIComponent(sessionId)}`;
            
            chatContainer.innerHTML = '';
            chatContainer.appendChild(iframe);
            
            iframe.onload = () => {
                setTimeout(() => {
                    iframe.style.visibility = 'visible';
                    document.querySelector('.container').classList.add('slide-left');
                    chatContainer.classList.add('slide-left');
                    history.pushState({page: 'chat'}, '', 'chat');
                }, 50);
            };
        }

        function closeChat() {
            document.querySelector('.container').classList.remove('slide-left');
            chatContainer.classList.remove('slide-left');
            controller.getRecentSessions(20);
            
            // Update the URL in the parent window to reflect we're back to main screen
            if (window.parent && window.parent !== window) {
                console.log("updating url");
                const currentUrl = new URL(window.parent.location.href);
                currentUrl.searchParams.set('screen', 'MAIN');
                currentUrl.searchParams.set('remoteId', 'null');
                window.parent.history.replaceState({}, '', currentUrl.toString());
            }
            
            setTimeout(() => {
                chatContainer.innerHTML = '';
            }, 300);
        }
        function fillInput(value) {
            const input = document.getElementById("numberInput");
            if (input) {
                input.value = value;
            }
        }
        function makeCall(remoteId, contact) {
            const callingId = document.getElementById('callingId');
            console.log("contact: "+contact);
            callingId.textContent = contact && contact !== '' ? contact : remoteId;
            overlay.classList.add('show');
            
            // The cancel button will be handled by the controller
            document.getElementById('cancelCall').addEventListener('click', () => {
                controller.rejectCall(remoteId);
                overlay.classList.remove('show');
                // Controller cancel call functionality will be added here
            }, { once: true });  // Remove listener after first click
            
            controller.call(remoteId);
        }
        function downloadFile(fileId, cid, messageId) {
            console.log("downloading file: "+fileId);
            controller.downloadFile(fileId, cid, messageId);
            // Implement file download functionality here
        }

        // ==================== VOICE MAIL FUNCTIONALITY ====================
        
        const voicemailButton = document.querySelector(".voicemail");
        const voicemailModal = document.getElementById("voicemailModal");
        const voicemailClose = document.getElementById("voicemailClose");
        const voicemailRecipient = document.getElementById("voicemailRecipient");
        const recordButton = document.getElementById("recordButton");
        const stopButton = document.getElementById("stopButton");
        const sendVoicemailButton = document.getElementById("sendVoicemailButton");
        const recordingTimer = document.getElementById("recordingTimer");
        const recordingStatus = document.getElementById("recordingStatus");
        const waveformContainer = document.getElementById("waveformContainer");
        const audioPlayer = document.getElementById("audioPlayer");
        const audioPlayback = document.getElementById("audioPlayback");

        let mediaRecorder;
        let audioChunks = [];
        let recordingStartTime;
        let timerInterval;
        let audioBlob;
        let waveformBars = [];

        // Initialize waveform bars
        function initWaveform() {
            waveformContainer.innerHTML = '';
            waveformBars = [];
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.className = 'waveform-bar';
                bar.style.height = '4px';
                waveformContainer.appendChild(bar);
                waveformBars.push(bar);
            }
        }

        // Animate waveform during recording
        function animateWaveform() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                waveformBars.forEach(bar => {
                    const height = Math.random() * 50 + 10;
                    bar.style.height = height + 'px';
                });
                requestAnimationFrame(animateWaveform);
            }
        }

        // Reset waveform
        function resetWaveform() {
            waveformBars.forEach(bar => {
                bar.style.height = '4px';
            });
        }

        // Open voice mail modal
        voicemailButton.addEventListener("click", function() {
            if (input.value === "") {
                alert("Please enter an email address first");
                return;
            }
            voicemailRecipient.textContent = input.value;
            voicemailModal.classList.add('show');
            initWaveform();
            resetRecording();
        });

        // Close voice mail modal
        voicemailClose.addEventListener("click", closeVoicemailModal);
        voicemailModal.addEventListener("click", function(e) {
            if (e.target === voicemailModal) {
                closeVoicemailModal();
            }
        });

        function closeVoicemailModal() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
            }
            voicemailModal.classList.remove('show');
        }

        // Reset recording state
        function resetRecording() {
            audioChunks = [];
            audioBlob = null;
            recordingTimer.textContent = '00:00';
            recordingStatus.innerHTML = '<span>Ready to record</span>';
            recordButton.disabled = false;
            stopButton.disabled = true;
            sendVoicemailButton.style.display = 'none';
            audioPlayer.classList.remove('show');
            resetWaveform();
        }

        // Start recording
        recordButton.addEventListener("click", async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayback.src = audioUrl;
                    audioPlayer.classList.add('show');
                    sendVoicemailButton.style.display = 'block';
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                recordingStartTime = Date.now();
                
                // Update UI
                recordButton.disabled = true;
                stopButton.disabled = false;
                recordingStatus.innerHTML = '<div class="recording-dot"></div><span>Recording...</span>';
                
                // Start timer
                timerInterval = setInterval(updateTimer, 100);
                
                // Animate waveform
                animateWaveform();
                
            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Could not access microphone. Please check permissions.');
            }
        });

        // Stop recording
        stopButton.addEventListener("click", stopRecording);

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                clearInterval(timerInterval);
                recordButton.disabled = false;
                stopButton.disabled = true;
                recordingStatus.innerHTML = '<span>Recording complete</span>';
                resetWaveform();
            }
        }

        // Update timer
        function updateTimer() {
            const elapsed = Date.now() - recordingStartTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            
            const formattedTime = 
                String(minutes).padStart(2, '0') + ':' + 
                String(remainingSeconds).padStart(2, '0');
            
            recordingTimer.textContent = formattedTime;
        }

        // Send voicemail via email
        sendVoicemailButton.addEventListener("click", async function() {
            if (!audioBlob) {
                alert('No recording available');
                return;
            }

            const recipientEmail = input.value;
            
            // Convert blob to base64 for download
            const reader = new FileReader();
            reader.onloadend = function() {
                const base64Audio = reader.result;
                
                // Create download link
                const downloadLink = document.createElement('a');
                downloadLink.href = base64Audio;
                downloadLink.download = `voicemail_${Date.now()}.webm`;
                
                // Trigger download
                downloadLink.click();
                
                // Prepare email
                const subject = encodeURIComponent('Voice message from PhoneMyEmail');
                const body = encodeURIComponent(
                    `Hi,\n\n` +
                    `I tried to contact you with PhoneMyEmail, but you don't have a user yet.\n\n` +
                    `I've recorded a voice message for you. Please find the audio file that was just downloaded to your device and attach it to this email before sending.\n\n` +
                    `If you want to phone me back, feel free to phone my email!\n\n` +
                    `Best regards`
                );
                
                // Open mailto link
                const mailtoLink = `mailto:${recipientEmail}?subject=${subject}&body=${body}`;
                window.location.href = mailtoLink;
                
                // Close modal after a short delay
                setTimeout(() => {
                    closeVoicemailModal();
                    alert('Voice message downloaded! Please attach it to the email that just opened.');
                }, 500);
            };
            
            reader.readAsDataURL(audioBlob);
        });
    </script>
</body>
</html>
